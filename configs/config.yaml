server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_grace: 10s

# Email delivery for the contact form.
# provider: ""        → dev mode, messages are logged via slog (no network)
#           "smtp"    → net/smtp via STARTTLS using email.smtp.*
#           "resend"  → Resend HTTP API using email.resend.api_key
#
# In production, override via env vars (PORTFOLIO_EMAIL_PROVIDER,
# PORTFOLIO_EMAIL_RESEND_API_KEY, etc.) instead of committing secrets.
email:
  provider: ""
  from: "noreply@about-me.dev"
  to: "miles.adrock@gmail.com"
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
  resend:
    api_key: ""

site:
  base_url: "http://localhost:8080"
